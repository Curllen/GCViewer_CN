name: Build and Release GCViewer_CN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置JDK 1.8（适配1.8.0_202）
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven # 缓存Maven依赖

      # 3. 强制设置UTF-8编码环境（关键修复）
      - name: Set UTF-8 environment
        run: |
          echo "MAVEN_OPTS=-Dfile.encoding=UTF-8" >> $GITHUB_ENV
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

      # 4. 验证JDK/编码环境（可选，便于排查）
      - name: Verify environment
        run: |
          java -version
          javac -version
          echo "File encoding: $(java -Dfile.encoding=UTF-8 -XshowSettings:properties -version 2>&1 | grep file.encoding)"

      # 5. Maven打包（指定UTF8编码）
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests -Dfile.encoding=UTF-8
          # 过滤出可运行JAR包（排除源码/测试包）
          echo "JAR_FILE=$(find ./target -name '*.jar' -type f | grep -v 'sources\|javadoc\|tests' | head -n1)" >> $GITHUB_ENV

      # 6. 创建Release并上传JAR
      - name: Create Release and Upload JAR
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: "GCViewer_CN ${{ github.ref_name }}（JDK 1.8.0_202编译，修复UTF8Control缺失问题）"
          files: ${{ env.JAR_FILE }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}