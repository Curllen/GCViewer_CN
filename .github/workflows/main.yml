name: Build and Release GCViewer_CN

# 触发条件：1. 推送以v开头的标签；2. 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，避免Maven版本插件报错

      # 步骤2：配置JDK 1.8（适配1.8.0_202）
      - name: Set up JDK 1.8.0_202
        uses: actions/setup-java@v4
        with:
          java-version: '8' # JDK 1.8对应配置为8
          distribution: 'temurin' # Eclipse Temurin（Adoptium）的JDK 8兼容1.8.0_202
          cache: maven # 缓存Maven依赖，加速构建

      # 步骤3：Maven打包（跳过测试，如需执行测试可移除-DskipTests）
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests
          # 自动查找target下的可运行JAR包（排除源码包、文档包）
          echo "JAR_FILE=$(find ./target -name '*.jar' -type f | grep -v 'sources\|javadoc\|tests' | head -n1)" >> $GITHUB_ENV

      # 步骤4：创建Release并上传JAR包
      - name: Create Release and Upload JAR
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: "GCViewer_CN ${{ github.ref_name }} 自动构建版本（JDK 1.8.0_202编译）"
          files: ${{ env.JAR_FILE }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
